<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON TIDE — rainy neon harbor 5v5</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #070d18;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #e8f4ff; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; }
  .hud-top { position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; align-items: center; z-index: 5; pointer-events: none; }
  .hud-score { font-weight: 800; letter-spacing: 2px; font-size: 17px; padding: 6px 14px;
    background: rgba(8,16,26,.78); border: 1px solid rgba(255,255,255,.14); border-radius: 4px; }
  .hud-score.tide { color: #19e3c2; border-color: rgba(25,227,194,.5); }
  .hud-score.warden { color: #ff2e88; border-color: rgba(255,46,136,.5); }
  .hud-timer { font-weight: 800; font-size: 20px; padding: 6px 16px; background: rgba(8,16,26,.85);
    border: 1px solid rgba(255,255,255,.2); border-radius: 4px; font-variant-numeric: tabular-nums; }
  .hud-objective { position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
    font-size: 13px; letter-spacing: 1px; color: #cfe8ff; background: rgba(8,16,26,.6);
    padding: 5px 12px; border-radius: 3px; z-index: 5; pointer-events: none; white-space: nowrap; }
  .hud-carrier { position: absolute; top: 96px; left: 50%; transform: translateX(-50%);
    font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #ffd166; z-index: 5; pointer-events: none; display: none; }
  .hud-surge { position: absolute; top: 122px; left: 50%; transform: translateX(-50%);
    font-size: 12px; font-weight: 800; letter-spacing: 2px; color: #0a1420; background: #19e3c2;
    padding: 4px 12px; border-radius: 3px; z-index: 5; pointer-events: none; display: none;
    animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { opacity: .75; } to { opacity: 1; } }
  .hud-tr { position: absolute; top: 14px; right: 14px; z-index: 5; display: flex;
    flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: none; }
  .hud-minimap { border: 1px solid rgba(255,255,255,.25); border-radius: 4px; background: rgba(8,16,26,.8); }
  .hud-killfeed { text-align: right; font-size: 13px; font-weight: 600; text-shadow: 0 1px 3px #000; }
  .hud-kf-line { margin-top: 3px; }
  .hud-bl { position: absolute; left: 18px; bottom: 18px; z-index: 5; pointer-events: none; width: 240px; }
  .hud-label { font-size: 10px; letter-spacing: 2px; color: #9fb8cc; margin: 6px 0 3px; }
  .hud-bar { height: 12px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); border-radius: 3px; overflow: hidden; }
  .hud-bar.hp { height: 16px; }
  .hud-fill { height: 100%; background: #19e3c2; width: 100%; transition: width .15s; }
  .hud-bar.ar .hud-fill { background: #7df9ff; }
  .hud-bar.ch .hud-fill { background: #ff2e88; }
  .hud-num { font-size: 22px; font-weight: 800; margin-top: 2px; }
  .hud-br { position: absolute; right: 18px; bottom: 18px; z-index: 5; pointer-events: none; text-align: right; }
  .hud-weapon { font-size: 15px; font-weight: 700; letter-spacing: 1px; }
  .hud-ammo { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .hud-money { font-size: 20px; font-weight: 800; color: #ffd166; }
  .hud-gadgets { font-size: 12px; color: #9fb8cc; margin-top: 4px; }
  .hud-cross { position: absolute; left: 50%; top: 50%; width: 0; height: 0; z-index: 4; pointer-events: none;
    --sp: 6px; }
  .hud-cline { position: absolute; background: #e8f4ff; box-shadow: 0 0 2px #000; }
  .hud-cline.t { left: -1px; top: calc(-14px - var(--sp)); width: 2px; height: 9px; }
  .hud-cline.b { left: -1px; top: calc(5px + var(--sp)); width: 2px; height: 9px; }
  .hud-cline.l { top: -1px; left: calc(-14px - var(--sp)); height: 2px; width: 9px; }
  .hud-cline.r { top: -1px; left: calc(5px + var(--sp)); height: 2px; width: 9px; }
  .hud-cdot { position: absolute; left: -1.5px; top: -1.5px; width: 3px; height: 3px; background: #e8f4ff; border-radius: 50%; }
  .hud-hitmark { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    font-size: 26px; font-weight: 900; opacity: 0; z-index: 4; pointer-events: none; text-shadow: 0 0 4px #000; }
  .hud-channel { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); width: 260px;
    z-index: 5; pointer-events: none; display: none; text-align: center; }
  .hud-vignette { position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 42%, rgba(255,30,60,.55) 100%); }
  .hud-flash { position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: 0; background: #fff; }
  .hud-banner { position: absolute; left: 50%; top: 34%; transform: translate(-50%,-50%); z-index: 7;
    text-align: center; display: none; pointer-events: none; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
  .hud-banner-title { font-size: 42px; font-weight: 900; letter-spacing: 4px; }
  .hud-banner-sub { font-size: 16px; letter-spacing: 2px; margin-top: 6px; color: #cfe8ff; }
  .hud-buy { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 8;
    width: 480px; background: rgba(7,13,24,.92); border: 1px solid rgba(25,227,194,.45);
    border-radius: 8px; padding: 18px 20px; display: none; }
  .hud-buy-title { font-size: 18px; font-weight: 900; letter-spacing: 3px; color: #19e3c2; }
  .hud-buy-title span { color: #9fb8cc; font-size: 12px; letter-spacing: 2px; }
  .hud-buy-money { font-size: 22px; font-weight: 800; color: #ffd166; margin: 8px 0; }
  .hud-buy-row { display: flex; gap: 10px; align-items: center; padding: 8px 10px; cursor: pointer;
    border: 1px solid transparent; border-radius: 4px; font-size: 14px; }
  .hud-buy-row:hover { background: rgba(25,227,194,.12); border-color: rgba(25,227,194,.4); }
  .hud-buy-row.poor { opacity: .45; }
  .hud-buy-row .k { display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center;
    background: rgba(255,255,255,.14); border-radius: 3px; font-weight: 800; font-size: 12px; }
  .hud-buy-row .n { flex: 1; font-weight: 600; }
  .hud-buy-row .p { color: #ffd166; font-weight: 800; }
  .hud-buy-row .o { color: #19e3c2; font-size: 11px; font-weight: 800; }
  .hud-buy-hint { font-size: 12px; color: #9fb8cc; margin-top: 10px; }
  .hud-deploy { margin-top: 12px; width: 100%; padding: 11px; font-size: 16px; font-weight: 900;
    letter-spacing: 3px; color: #0a1420; background: #19e3c2; border: none; border-radius: 4px; cursor: pointer; }
  .hud-deploy:hover { background: #4ff0d2; }
  .hud-menu { position: absolute; inset: 0; z-index: 10; display: none; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: linear-gradient(180deg, rgba(7,13,24,.25) 0%, rgba(7,13,24,.72) 78%); }
  .hud-menu-kicker { font-size: 13px; letter-spacing: 5px; color: #19e3c2; font-weight: 700; }
  .hud-menu-title { font-size: 96px; line-height: .92; font-weight: 900; letter-spacing: 6px; margin: 14px 0;
    background: linear-gradient(90deg, #19e3c2, #7df9ff 45%, #ff2e88); -webkit-background-clip: text;
    background-clip: text; color: transparent; text-shadow: none; }
  .hud-menu-sub { font-size: 16px; color: #cfe8ff; max-width: 520px; }
  .hud-menu-btn { margin-top: 26px; padding: 14px 34px; font-size: 17px; font-weight: 900; letter-spacing: 3px;
    color: #0a1420; background: #19e3c2; border: none; border-radius: 5px; cursor: pointer; }
  .hud-menu-btn:hover { background: #4ff0d2; }
  .hud-menu-foot { margin-top: 22px; font-size: 12px; letter-spacing: 1px; color: #9fb8cc; }
</style>
